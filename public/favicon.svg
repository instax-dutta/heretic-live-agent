<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="faviconTitle">
  <title id="faviconTitle">Heretic Live</title>
  <!-- The arrival strip: one bar per second, the newest in paper white, with the
       30-day mean drawn as a capped rule. Matches the site ground and phosphor. -->
