  <g>
    <rect x="9"  y="38" width="4" height="17" fill="#ffb000" opacity="0.5"/>
    <rect x="16" y="29" width="4" height="26" fill="#ffb000" opacity="0.5"/>
    <rect x="23" y="34" width="4" height="21" fill="#ffb000" opacity="0.62"/>
    <rect x="30" y="20" width="4" height="35" fill="#ffb000" opacity="0.62"/>
    <rect x="37" y="33" width="4" height="22" fill="#ffb000" opacity="0.5"/>
    <rect x="44" y="15" width="4" height="40" fill="#ffb000" opacity="0.85"/>
    <rect x="51" y="26" width="4" height="29" fill="#f4f2ec"/>
  </g>
  <rect x="40.5" y="11" width="1.5" height="46" fill="#ffb000"/>
  <rect x="38" y="9" width="6" height="6" fill="#ffb000"/>
  <rect x="7" y="55" width="50" height="2" fill="#2a2e34"/>
</svg>