name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh published data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node update-snapshot.mjs

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet; then
            echo "No change in the published snapshot."
            exit 0
          fi
          AS_OF=$(node -e "process.stdout.write(require('fs').readFileSync('src/main.js','utf8').match(/const fallbackAsOf = \"([^\"]+)\";/)[1])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stats.json public/data/models.json index.html src/main.js public/sitemap.xml
          git commit -m "Refresh published snapshot to ${AS_OF}"
          git push

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
